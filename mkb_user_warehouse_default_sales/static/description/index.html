<!DOCTYPE html>
<html>
<head>
    <title></title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</head>
<body>

<!-- moduule info -->
<section class="module_name" style="padding:10px; margin:10px 0">
    <div class="container">
        <div class="ss_heading" style="text-align:center">
            <h4 style="font-size:24px; line-height:40px; color:#b1115c; font-weight:600; text-transform:capitalize">
                Warehouse Based on Users
            </h4>
        </div>
    </div>
</section>
<!-- module info -->
<section class="ss_tab">
    <div class="container">
        <ul class="nav nav-tabs justify-content-center" id="myTab" role="tablist" style="padding-bottom: 10px;
    border-bottom: 1px solid #b9b9b9;background-color: #ffffff;">
            <li class="nav-item btn"
                style="color: #fff;display:inline-block; padding:0; float:none;background-color: #0a7fe9;border-radius: 0;margin: 0 5px;">
                <span class="nav-link active" data-toggle="tab" role="tab" id="screenshots-tab" href="#screenshots"
                      aria-controls="screenshots" aria-selected="true"
                      style="font-weight:600;border: 2px solid #f40004;border-radius: 0;">Screenshots</span>
            </li>
        </ul>
        <div class="tab-content" id="myTabContent" style="padding:30px">

            <!-- img start -->
            <div class="tab-pane fade text-align form-new active show" id="screenshots" role="tabpanel"
                 aria-labelledby="screenshots-tab">
                <!-- screenshot 1 -->
                <div class="screeshot" style="text-align:center">
                    <img src="1.png"
                         style="max-width:100%;border: 1px solid #ccc; margin-bottom:20px;margin-top: 20px;">
                </div>
                <div class="screeshot" style="text-align:center">
                    <img src="2.png"
                         style="max-width:100%;border: 1px solid #ccc; margin-bottom:20px;margin-top: 20px;">
                </div>
                <div class="screeshot" style="text-align:center">
                    <img src="3.png"
                         style="max-width:100%;border: 1px solid #ccc; margin-bottom:20px;margin-top: 20px;">
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
